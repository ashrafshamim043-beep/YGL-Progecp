# Y.G.L Office System -- local development environment
# Phase 8.1 scope: backend + PostgreSQL + Redis.
# This file is for LOCAL DEVELOPMENT ONLY. It does not create/apply any
# database schema by itself -- migrations are run explicitly (see
# backend/alembic/), never automatically on container start, so that no
# DDL executes without an explicit, reviewed action.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ygl_office_dev
      POSTGRES_USER: ygl_dev
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - ygl_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://ygl_dev:dev_only_change_me@postgres:5432/ygl_office_dev
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: dev_only_change_me_this_is_not_secure
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./commission_engine_pinned:/app/commission_engine_pinned:ro   # read-only mount, deliberate

volumes:
  ygl_postgres_data:
